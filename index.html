<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>80s Retro Runner Game</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0d0221;
            user-select: none;
        }

        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #ff007f;
            font-size: 24px;
            font-weight: bold;
            text-shadow: 0 0 10px #ff007f, 0 0 20px #00f6ff;
            z-index: 10;
        }

        #game-over {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #fff;
            text-align: center;
            display: none;
            z-index: 10;
            background: rgba(13, 2, 33, 0.95);
            padding: 30px;
            border-radius: 15px;
            border: 2px solid #ff007f;
            box-shadow: 0 0 25px #ff007f, inset 0 0 15px #00f6ff;
        }

        #game-over h1 { 
            color: #ff007f; 
            margin-bottom: 10px;
            text-shadow: 0 0 10px #ff007f;
        }

        #restart-btn {
            margin-top: 15px;
            padding: 12px 28px;
            font-size: 18px;
            background: linear-gradient(45deg, #ff007f, #00f6ff);
            color: #fff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 0 12px #00f6ff;
        }

        /* মোবাইল স্ক্রিন টাচ জোন */
        .touch-zone {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 50%;
            z-index: 5;
        }
        #left-zone { left: 0; }
        #right-zone { right: 0; }
    </style>
    <!-- Three.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="ui">স্কোর: <span id="score">0</span></div>

    <div id="game-over">
        <h1>গেম ওভার!</h1>
        <p>আপনার মোট স্কোর: <span id="final-score">0</span></p>
        <button id="restart-btn" onclick="resetGame()">আবার চেষ্টা করুন</button>
    </div>

    <!-- মোবাইল টাচ কন্ট্রোল -->
    <div id="left-zone" class="touch-zone"></div>
    <div id="right-zone" class="touch-zone"></div>

    <script>
        let scene, camera, renderer, playerGroup, obstacles = [];
        let score = 0, isGameOver = false;
        let lanePositions = [-2.2, 0, 2.2];
        let currentLane = 1;

        function init() {
            // ১. থ্রিডি সিন ও ক্যামেরা
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x0d0221, 0.02);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 3.5, 7);
            camera.lookAt(0, 1.5, 0);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            // ২. লাইটিং (৮০-র দশকের নিয়ন ভাইব)
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0x00f6ff, 1);
            dirLight.position.set(0, 10, 5);
            scene.add(dirLight);

            // ৩. ক্যারেক্টর সেটআপ (আপনার ছবি ওয়ালা ৩ডি কার্ড)
            playerGroup = new THREE.Group();

            const textureLoader = new THREE.TextureLoader();
            const personTexture = textureLoader.load('person.jpg');

            // ফ্রেম বা কার্ড ডিজাইন
            const cardGeo = new THREE.BoxGeometry(1.2, 2.0, 0.1);
            const materials = [
                new THREE.MeshPhongMaterial({ color: 0xff007f }), // ডান
                new THREE.MeshPhongMaterial({ color: 0xff007f }), // বাম
                new THREE.MeshPhongMaterial({ color: 0xff007f }), // উপর
                new THREE.MeshPhongMaterial({ color: 0xff007f }), // নিচ
                new THREE.MeshPhongMaterial({ map: personTexture }), // সামনে (আপলোড করা ছবি)
                new THREE.MeshPhongMaterial({ color: 0x00f6ff })  // পেছন
            ];

            const characterMesh = new THREE.Mesh(cardGeo, materials);
            characterMesh.position.y = 1.0;
            playerGroup.add(characterMesh);

            playerGroup.position.x = lanePositions[currentLane];
            scene.add(playerGroup);

            // ৪. রেট্রো স্টাইলের ট্র্যাক/রাস্তা
            const gridHelper = new THREE.GridHelper(200, 50, 0xff007f, 0x00f6ff);
            gridHelper.position.z = -90;
            gridHelper.position.y = 0;
            scene.add(gridHelper);

            // ইভেন্ট লিসেনার
            window.addEventListener('resize', onWindowResize);
            document.addEventListener('keydown', handleKeyDown);

            document.getElementById('left-zone').addEventListener('touchstart', (e) => { e.preventDefault(); changeLane(-1); });
            document.getElementById('right-zone').addEventListener('touchstart', (e) => { e.preventDefault(); changeLane(1); });

            animate();
            spawnObstacles();
        }

        function changeLane(dir) {
            if (isGameOver) return;
            currentLane += dir;
            if (currentLane < 0) currentLane = 0;
            if (currentLane > 2) currentLane = 2;
        }

        function handleKeyDown(e) {
            if (e.key === 'ArrowLeft' || e.key === 'a') changeLane(-1);
            if (e.key === 'ArrowRight' || e.key === 'd') changeLane(1);
        }

        function spawnObstacles() {
            if (isGameOver) return;

            // বাধার ডিজাইন (৩ডি কিউব)
            const obstacleGeo = new THREE.BoxGeometry(1.4, 1.2, 1.2);
            const obstacleMat = new THREE.MeshPhongMaterial({ color: 0xff0055, wireframe: false });
            const obstacle = new THREE.Mesh(obstacleGeo, obstacleMat);

            const randomLane = Math.floor(Math.random() * 3);
            obstacle.position.x = lanePositions[randomLane];
            obstacle.position.y = 0.6;
            obstacle.position.z = -80;

            scene.add(obstacle);
            obstacles.push(obstacle);

            setTimeout(spawnObstacles, Math.max(400, 1100 - score * 5));
        }

        function animate() {
            if (isGameOver) return;

            requestAnimationFrame(animate);

            // স্মুথ মুভমেন্ট
            playerGroup.position.x += (lanePositions[currentLane] - playerGroup.position.x) * 0.2;

            // রানিং বা দৌড়ানোর অনুভূতি দিতে কিছুটা দুলবে
            playerGroup.position.y = Math.sin(Date.now() * 0.01) * 0.08;

            score += 1;
            document.getElementById('score').innerText = Math.floor(score / 5);

            for (let i = obstacles.length - 1; i >= 0; i--) {
                const obs = obstacles[i];
                obs.position.z += 0.5 + (score * 0.0001);

                const diffZ = Math.abs(playerGroup.position.z - obs.position.z);
                const diffX = Math.abs(playerGroup.position.x - obs.position.x);

                if (diffZ < 0.8 && diffX < 0.8) {
                    gameOver();
                }

                if (obs.position.z > 10) {
                    scene.remove(obs);
                    obstacles.splice(i, 1);
                }
            }

            renderer.render(scene, camera);
        }

        function gameOver() {
            isGameOver = true;
            document.getElementById('final-score').innerText = Math.floor(score / 5);
            document.getElementById('game-over').style.display = 'block';
        }

        function resetGame() {
            obstacles.forEach(obs => scene.remove(obs));
            obstacles = [];
            score = 0;
            currentLane = 1;
            playerGroup.position.x = lanePositions[currentLane];
            isGameOver = false;
            document.getElementById('game-over').style.display = 'none';
            animate();
            spawnObstacles();
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        init();
    </script>
</body>
</html>
